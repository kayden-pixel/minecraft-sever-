# KingFeatures v0.1.3
# One plugin, modular features. Ultimate Economy Plus remains the money/shop/crate authority.

bottle:
  enabled: true
  id: kings_favor
  display-name: "&6&lKing's Favor Bottle"
  price: 255.0
  redeem-window-hours: 5
  hero-of-the-village-hours: 24
  amplifier: 0
  custom-model-data: 341255
  lore:
    - "&7A sealed royal favor from the King."
    - "&eCost: &6255"
    - "&eRedeem within: &f5 hours"
    - "&eEffect: &fHero of the Village"
    - "&eDuration: &f1 day"
    - ""
    - "&8Signed by KingFeatures"

resource-pack:
  enabled: true
  required: true
  send-delay-ticks: 20
  prompt: "&dSkyStrike visuals &7- ranks, icons and KingFeatures assets"

  # ZERO-SETUP DELIVERY:
  # KingFeatures contains its own rank pack and extracts/verifies it automatically.
  # Do NOT copy a pack into OmniPanel. Do NOT edit server.properties.
  # If ResourcePackManager is installed, KingFeatures auto-registers the embedded pack for merging/hosting.
  # If it is not installed, KingFeatures automatically sends its own built-in hosted pack URL instead.
  resourcepackmanager:
    enabled: true
    reload-after-register: true

  # Optional advanced override only. Leave blank for the built-in KingFeatures host.
  remote-url: ""
  remote-sha1: ""

omnipanel:
  enabled: true
  button-slot: 45
  button-priority: 110
  reconnect-seconds: 10

# Automatic visual mapping. OmniPanel remains the rank source of truth.
# /kf ranks opens the GUI. Everyone can view it; server operators can change global toggles.
# No LuckPerms permission nodes/groups are added, changed or removed by this system.
rank-visuals:
  enabled: true
  refresh-ticks: 100
  ranks:
    owner: true
    co_owner: true
    ceo: true
    manager: true
    admin: true
    builder: true
    developer: true
    moderator: true
    helper: true
    mvp: true
    vip: true
    youtuber: true
    member: true

troll-lab:
  enabled: true
  animation-period-ticks: 6
  action-cooldown-seconds: 2
  audit-to-console: true
  allow-self-target: true
