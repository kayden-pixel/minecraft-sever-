# KingFeatures v0.1.2
# One plugin, modular features. Ultimate Economy Plus remains the money/shop/crate authority.

bottle:
  enabled: true
  id: kings_favor
  display-name: "&6&lKing's Favor Bottle"
  price: 255.0
  redeem-window-hours: 5
  hero-of-the-village-hours: 24
  amplifier: 0
  custom-model-data: 341255
  lore:
    - "&7A sealed royal favor from the King."
    - "&eCost: &6255"
    - "&eRedeem within: &f5 hours"
    - "&eEffect: &fHero of the Village"
    - "&eDuration: &f1 day"
    - ""
    - "&8Signed by KingFeatures"

resource-pack:
  enabled: true
  required: true
  send-delay-ticks: 20
  prompt: "&dSkyStrike visuals &7- ranks, icons and KingFeatures assets"
  mode: AUTO

  # Preferred: if ResourcePackManager is installed, KingFeatures registers its pack there.
  resourcepackmanager:
    enabled: true
    reload-after-register: true

  # Direct remote fallback if ResourcePackManager is not installed.
  remote-url: ""
  remote-sha1: ""

  # Put the supplied KingFeatures rank pack here to make it the preferred pack.
  local-file: "resourcepack/KingFeatures-Pack.zip"
  auto-import-omnipanel-rank-pack: true
  omnipanel-rank-pack-path: "plugins/OmniPanel/rank-pack/Kingez341YT-Rank-Pack-1.21.11.zip"

omnipanel:
  enabled: true
  button-slot: 45
  button-priority: 110
  reconnect-seconds: 10

# Automatic, permissionless visual mapping. OmniPanel remains the rank source of truth.
# /kf ranks opens the GUI. Everyone can view it; server operators can change global toggles.
# No LuckPerms permission nodes/groups are added, changed or removed by this system.
rank-visuals:
  enabled: true
  refresh-ticks: 100
  ranks:
    owner: true
    co_owner: true
    ceo: true
    manager: true
    admin: true
    builder: true
    developer: true
    moderator: true
    helper: true
    mvp: true
    vip: true
    youtuber: true
    member: true

troll-lab:
  enabled: true
  animation-period-ticks: 6
  action-cooldown-seconds: 2
  audit-to-console: true
  allow-self-target: true
