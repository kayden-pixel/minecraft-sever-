# KingFeatures v0.2.0
# OmniPanel remains authoritative for ranks. KingFeatures only renders visuals.

bottle:
  enabled: true
  id: kings_favor
  display-name: "&6&lKing's Favor Bottle"
  price: 255.0
  redeem-window-hours: 5
  hero-of-the-village-hours: 24
  amplifier: 0
  custom-model-data: 341255
  lore:
    - "&7A sealed royal favor from the King."
    - "&eCost: &6255"
    - "&eRedeem within: &f5 hours"
    - "&eEffect: &fHero of the Village"
    - "&eDuration: &f1 day"
    - ""
    - "&8Signed by KingFeatures"

resource-pack:
  enabled: true
  required: true
  send-delay-ticks: 20
  prompt: "&dSkyStrike visuals &7- OmniPanel rank badges and KingFeatures assets"
  mode: AUTO

  bundled-rank-visuals:
    enabled: true

  resourcepackmanager:
    enabled: true
    reload-after-register: true

  remote-url: ""
  remote-sha1: ""

  local-file: "resourcepack/KingFeatures-Rank-Visuals.zip"

  auto-import-omnipanel-rank-pack: true
  omnipanel-rank-pack-path: "plugins/OmniPanel/rank-pack/Kingez341YT-Rank-Pack-1.21.11.zip"

rank-visuals:
  enabled: true
  refresh-ticks: 20

  # Rank detection is permission-free. KingFeatures asks OmniPanel's API which rank the player has.
  contexts:
    player-list: true
    display-name: true

  # Every supplied badge exists in the pack and can be toggled from /kf ranks.
  enabled-ranks:
    owner: true
    co_owner: true
    ceo: true
    manager: true
    admin: true
    builder: true
    developer: true
    moderator: true
    helper: true
    mvp: true
    vip: true
    youtuber: true
    member: true

omnipanel:
  enabled: true
  button-slot: 45
  button-priority: 110
  rank-visuals-button-slot: 46
  rank-visuals-button-priority: 115
  reconnect-seconds: 10

troll-lab:
  enabled: true
  animation-period-ticks: 6
  action-cooldown-seconds: 2
  audit-to-console: true
  allow-self-target: true
